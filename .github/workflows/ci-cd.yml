name: Build, Test, and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Run unit tests
        run: pytest -v

  build-and-test-container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Train model (image needs model/ present)
        run: |
          pip install -r requirements.txt
          python train.py

      - name: Build Docker image
        run: docker build -t iris-service:test .

      - name: Run container
        run: docker run -d -p 8000:8000 --name test-container iris-service:test

      - name: Wait for service to be healthy
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Hit /predict endpoint
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'

      - name: Stop container
        run: docker rm -f test-container

  publish:
    needs: build-and-test-container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Train model
        run: |
          pip install -r requirements.txt
          python train.py

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/iris-service
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}